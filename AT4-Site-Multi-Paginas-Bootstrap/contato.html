<div class="container my-4">
    <div class="text-center">
        <h2 class="text-center">Fale Conosco</h2>
    <p class="text-muted text-center">Tem alguma dúvida, sugestão ou quer enviar seu feedback? Entre em contato com a nossa equipe!</p>
    </div>

    <div class="row justify-content-center">
    
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card">
            <div class="card-body shadow-sm bg-light border p-4">

<!--Criando formulário-->
    <form>
  <div class="mb-3">
    <label for="nome" class="form-label fw-bold">Nome</label>
    <input type="text" class="form-control" id="nome" placeholder="Digite seu nome completo" required>
  </div>

<!--Campo email-->
    <div class="mb-3">
    <label for="email" class="form-label fw-bold">E-mail</label>
    <input type="email" aria-describedby="emailHelp" class="form-control" id="email" placeholder="exemplo@gmail.com" required>
    <div id="emailHelp" class="form-text">Nunca vamos compartilhar seu e-mail com ninguém.</div>
  </div>

  <!--Campo Assunto-->
  <div class="mb-3">
    <label for="assunto" class="form-label fw-bold">Assunto</label>
    <select class="form-select" id="assunto" required>
        <option value="" selected disabled>Selecione o motivo do contato</option>
        <option value="adocao">Dúvida sobre Adoção</option>
        <option value="voluntario">Quero ser Voluntário</option>
        <option value="feedback">Feedback ou Sugestão</option>
        <option value="outro">Outro Assunto</option>
    </select>
    </div>

<!--Campo Mensagem-->
  <div class="mb-3">
    <label for="mensagem" class="form-label fw-bold">Mensagem</label>
  <textarea class="form-control" id="mensagem" rows="4" placeholder="Escreva sua mensagem ou feedback aqui..." required></textarea>
  </div>

<!--Campo Checkbox-->
    <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="termosCheck">
    <label class="form-check-label" for="termosCheck">Concordo em receber novidades e informativos do Lar de Patas</label>
    </div>

<!--Botão de Envio-->
    <div class="d-grid">
        <button type="submit" class="btn btn-success btn-lg">Enviar Mensagem</button>
    </div>

    </form>
        </div>
    </div>
    </div>

</div>
</div>
